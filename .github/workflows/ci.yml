name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Database URL for Prisma client generation (not actual connection)
  DATABASE_URL: "postgresql://user:password@localhost:5432/db?schema=public"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test -- --coverage --coverageReporters=text-summary

      - name: Check Coverage Thresholds
        run: |
          npm test -- --coverage --coverageReporters=json-summary
          node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const { branches, functions, lines, statements } = coverage.total;
            const thresholds = { branches: 85, functions: 90, lines: 90, statements: 90 };
            let failed = false;
            for (const [key, threshold] of Object.entries(thresholds)) {
              const actual = coverage.total[key].pct;
              if (actual < threshold) {
                console.error('❌ ' + key + ': ' + actual + '% < ' + threshold + '%');
                failed = true;
              } else {
                console.log('✅ ' + key + ': ' + actual + '% >= ' + threshold + '%');
              }
            }
            if (failed) process.exit(1);
          "

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Required env vars for build (can be dummy values for CI)
          NEXTAUTH_SECRET: "ci-test-secret"
          JWT_SECRET: "ci-test-jwt-secret"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
